<!doctype html><meta charset=utf-8><title>Workday - a multi-file slot, at the depth it really has</title>
<!-- The shape behind "two resumes on one slot". Two things about it, and the
     second is why this file was rewritten (2026-10-09).

     First (2026-10-07): Workday's Resume/CV is a dropzone that takes more
     than one file, and each row's control is a bin button whose only
     readable name is a `title="Delete"` - the label a check reads is the
     filename, and some tenants give it neither. What always names it is
     `data-automation-id="delete-file"`.

     Second (2026-10-09): the *nesting*. This markup is taken from a live
     Applied Materials form, attribute for attribute, because the hand-made
     version of it put <h3>Resume/CV</h3> two ancestors above the bin button
     and the real page puts it NINE (Workday wraps the field in a <p>, which
     the parser closes before the <div>, so the tag count is ten and the
     element count is nine). `FIND_REMOVE_FN` climbed six, found no
     heading at all, cleared nothing, and the tailored resume went on beside
     what was already there - while this fixture said it all worked. A
     fixture shallower than the page it stands for certifies the opposite of
     what is true.

     Both rows are the same file at the same size, which is what the report
     showed: not Jobright's and ours, ours three times. -->
<body>
<div role="group" aria-labelledby="Resume/CV-section">
  <h4 id="Resume/CV-section" class="css-1c2ie72">Resume/CV</h4>
  <div data-fkit-id="resumeAttachments--null" class="css-1obf64m">
    <p class="css-1qxtz39">
    <div data-automation-id="formField-" data-fkit-id="resumeAttachments--attachments" class="css-7t35fz">
      <label id="label129" class="css-1ud5i8o"><span>Upload a file (5MB max)<abbr aria-hidden="true">*</abbr></span></label>
      <div class="css-15rz5ap">
        <div style="width:100%;max-width:704px;min-width:280px">
          <div data-automation-id="attachments-FileUpload" aria-labelledby="label129" class="css-1s544wy">
            <div class="css-wtpnzt">
              <div data-automation-id="file-upload-drop-zone" class="css-1ikudie">
                <div class="css-1ge88gr">Drop files here</div>
                <div class="css-xszj4y"><div class="css-1j5bq6h">or</div>
                  <button type="button" data-automation-id="select-files" id="resumeAttachments--attachments" class="css-1hja6un"><span>Select files</span></button>
                </div>
              </div>
              <input data-automation-id="file-upload-input-ref" type="file" multiple class="css-1hyfx7x">
            </div>
            <div class="css-10klw3m">
              <div data-automation-id="file-upload-item" class="css-1o2jhdo">
                <div class="css-1umnvfm"><div class="css-38z0xm"><span class="css-g4dbf"><svg viewBox="0 0 24 24"></svg></span></div>
                  <div class="css-17qamad">
                    <div data-automation-id="file-upload-item-name" class="css-p5yt7t">Bhuvan_Rajanahally_Jayakumar_Resume.pdf</div>
                    <div class="css-1rebdqa">60.38 KB</div>
                    <div data-automation-id="file-upload-successful" class="css-1k6yql2">Successfully Uploaded!</div>
                  </div>
                </div>
                <div class="css-e96vt0">
                  <button type="button" data-automation-id="delete-file" aria-label="Delete Bhuvan_Rajanahally_Jayakumar_Resume.pdf" title="Delete" class="css-hu8yut"><span><svg viewBox="0 0 24 24"></svg></span></button>
                </div>
              </div>
              <div data-automation-id="file-upload-item" class="css-1o2jhdo">
                <div class="css-1umnvfm"><div class="css-38z0xm"><span class="css-g4dbf"><svg viewBox="0 0 24 24"></svg></span></div>
                  <div class="css-17qamad">
                    <div data-automation-id="file-upload-item-name" class="css-p5yt7t">Bhuvan_Rajanahally_Jayakumar_Resume.pdf</div>
                    <div class="css-1rebdqa">60.38 KB</div>
                    <div data-automation-id="file-upload-successful" class="css-1k6yql2">Successfully Uploaded!</div>
                  </div>
                </div>
                <div class="css-e96vt0">
                  <button type="button" data-automation-id="delete-file" aria-label="Delete Bhuvan_Rajanahally_Jayakumar_Resume.pdf" title="Delete" class="css-hu8yut"><span><svg viewBox="0 0 24 24"></svg></span></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </p>
  </div>
</div>
<div data-automation-id="smartDivider" class="css-knnl48"></div>
<div role="group" aria-labelledby="Cover-Letter-section">
  <h4 id="Cover-Letter-section" class="css-1c2ie72">Cover Letter</h4>
  <div data-fkit-id="coverLetterAttachments--null" class="css-1obf64m">
    <p class="css-1qxtz39">
    <div data-automation-id="formField-" data-fkit-id="coverLetterAttachments--attachments" class="css-7t35fz">
      <label id="label141" class="css-1ud5i8o"><span>Upload a file (5MB max)</span></label>
      <div class="css-15rz5ap">
        <div style="width:100%;max-width:704px;min-width:280px">
          <div data-automation-id="attachments-FileUpload" aria-labelledby="label141" class="css-1s544wy">
            <div class="css-wtpnzt">
              <div data-automation-id="file-upload-drop-zone" class="css-1ikudie"><div class="css-1ge88gr">Drop files here</div></div>
              <input data-automation-id="file-upload-input-ref" type="file" multiple class="css-1hyfx7x">
            </div>
            <div class="css-10klw3m">
              <div data-automation-id="file-upload-item" class="css-1o2jhdo">
                <div class="css-1umnvfm"><div class="css-17qamad">
                  <div data-automation-id="file-upload-item-name" class="css-p5yt7t">their_cover_letter.pdf</div>
                  <div class="css-1rebdqa">12.00 KB</div>
                </div></div>
                <div class="css-e96vt0">
                  <button type="button" data-automation-id="delete-file" aria-label="Delete their_cover_letter.pdf" title="Delete" class="css-hu8yut"><span><svg viewBox="0 0 24 24"></svg></span></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </p>
  </div>
</div>
</body>
