<!doctype html><meta charset=utf-8><title>Greenhouse - the input is gone once a file is on</title>
<!-- The other shape, and the one the remove step was written for: no file
     input anywhere, a filename and a "Remove file" button in its place. -->
<body>
<div class="application--form">
  <div class="field">
    <label class="label">Resume/CV<span class="required">*</span></label>
    <div class="file-upload">
      <span class="filename">Bhuvan_Rajanahally_Jayakumar_Resume.pdf</span>
      <button type="button" class="remove">Remove file</button>
    </div>
  </div>
  <div class="field">
    <label class="label">Cover Letter</label>
    <div class="file-upload"><input id="cover" type="file"></div>
  </div>
</div>
</body>
