<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board scan</title>
<!--
  One file, no build step, the same as the review page. Terminal look,
  square corners, mono: purple is the machine, green is you, red is a no.
  The list and the role scroll apart, so clicking through four hundred
  roles never moves the list under the cursor.

  The keyboard is the point of this page: j / k to move, a for "it is in
  autopilot", d to decline with a reason, o to open the posting. A week of
  triage is a few thousand keystrokes, and every decline is kept with its
  reason because that pile is what the filters get tuned from.

  The day buttons are what make four thousand roles workable (2026-10-15).
  A pile that deep cannot be read at all, and the ones worth the first
  hour are the ones posted in the last one: today and yesterday are a
  button each, with their own counts on them, so today's postings are read
  today and yesterday's yesterday. The verdict is a tick per verdict
  rather than a one-of dropdown, because ok and caution are one pile.
-->
<style>
  :root {
    --bg: #0c0c0d; --ink: #e8e6e3; --dim: #8b8781; --line: #2a2a2c;
    --agent: #a678ff; --you: #5fd98a; --no: #ff6b6b; --warn: #ffc857;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  header {
    border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex;
    gap: 10px; align-items: center; flex-wrap: wrap;
  }
  header .title { color: var(--agent); letter-spacing: .08em; }
  header .grow { flex: 1; }
  button, select, input {
    background: #141416; color: var(--ink); border: 1px solid var(--line);
    padding: 4px 8px; font: inherit; border-radius: 0;
  }
  button:hover:not(:disabled) { border-color: var(--agent); cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.go { border-color: var(--you); color: var(--you); }
  button.no { border-color: var(--no); color: var(--no); }
  main { flex: 1; display: flex; min-height: 0; }
  nav { width: 44%; max-width: 620px; border-right: 1px solid var(--line); overflow-y: auto; }
  section.role { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .row { padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: #15151a; }
  .row.on { background: #1b1a24; border-left: 2px solid var(--agent); padding-left: 10px; }
  .row .top { display: flex; gap: 8px; align-items: baseline; }
  .row .co { color: var(--agent); }
  .row .ti { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--dim); font-size: 11.5px; display: flex; gap: 8px; }
  .chip { font-size: 10.5px; border: 1px solid var(--line); padding: 0 4px; color: var(--dim); }
  .chip.ok { color: var(--you); border-color: var(--you); }
  .chip.reject { color: var(--no); border-color: var(--no); }
  .chip.caution { color: var(--warn); border-color: var(--warn); }
  .chip.seen { color: var(--warn); border-color: var(--warn); }
  .chip.declined, .chip.added { color: var(--dim); }
  .row.decided { opacity: .45; }
  .applied {
    border: 1px solid var(--no); color: var(--no); padding: 6px 8px; margin-bottom: 12px;
  }
  h1 { font-size: 16px; margin: 0 0 2px; }
  h1 + .sub { color: var(--dim); margin-bottom: 12px; }
  .flags { margin: 10px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .text { white-space: pre-wrap; color: #cfcbc6; border-top: 1px solid var(--line);
          padding-top: 12px; margin-top: 12px; max-width: 80ch; }
  .actions { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .empty { color: var(--dim); padding: 24px 12px; }
  .days { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
          padding: 4px 12px; border-bottom: 1px solid var(--line); }
  .days .lab { color: var(--dim); }
  .days button.on { border-color: var(--agent); color: var(--agent); }
  .days button .n { color: var(--dim); }
  .days button.on .n { color: var(--you); }
  .ticks { display: flex; gap: 8px; align-items: center; }
  .ticks label { color: var(--dim); }
  .ticks label.ok { color: var(--you); }
  .ticks label.caution { color: var(--warn); }
  .ticks label.reject { color: var(--no); }
  .age { color: var(--you); }
  .age.old { color: var(--dim); }
  .runline { color: var(--agent); }
  .runline.error { color: var(--no); }
  a { color: var(--you); }
  nav::-webkit-scrollbar, section.role::-webkit-scrollbar { width: 9px; }
  nav::-webkit-scrollbar-thumb, section.role::-webkit-scrollbar-thumb { background: var(--line); }
  @media (max-width: 900px) {
    main { flex-direction: column; }
    nav { width: auto; max-width: none; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>

<header>
  <span class="title">BOARD SCAN</span>
  <select id="state">
    <option value="new">to read</option>
    <option value="">everything</option>
    <option value="declined">declined</option>
    <option value="added">in autopilot</option>
  </select>
  <span class="ticks">
    <label class="ok"><input type="checkbox" class="verdict" value="ok" checked> ok</label>
    <label class="caution"><input type="checkbox" class="verdict" value="caution" checked> caution</label>
    <label class="reject"><input type="checkbox" class="verdict" value="reject"> reject</label>
    <label><input type="checkbox" class="verdict" value="none"> not screened</label>
  </span>
  <select id="system">
    <option value="">all boards</option>
    <option value="greenhouse">greenhouse</option>
    <option value="lever">lever</option>
    <option value="ashby">ashby</option>
  </select>
  <label><input type="checkbox" id="hideseen"> hide known</label>
  <label><input type="checkbox" id="hideforeign" checked> hide abroad</label>
  <input id="q" placeholder="company or title" size="16">
  <span class="grow"></span>
  <span id="counts" class="meta"></span>
  <button id="harvest">Harvest slugs</button>
  <button id="crawl" class="go">Crawl boards</button>
</header>
<div class="days" id="days">
  <span class="lab">posted</span>
</div>
<div id="runline" style="padding:4px 12px"></div>
<div id="scheduleline" class="meta" style="padding:0 12px 4px; color:#8b8781"></div>

<main>
  <nav id="list"></nav>
  <section class="role" id="detail"><div class="empty">Pick a role.</div></section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let rows = [], at = -1, current = null;

// The day buttons, in the order they are worth pressing. `today` and
// `yesterday` are one day each; the rest are "since".
const WINDOWS = [
  ["today", "today"], ["yesterday", "yesterday"], ["3d", "3 days"],
  ["week", "week"], ["month", "month"], ["all", "everything"],
];
let window_ = "today";

const api = async (path, body) => {
  const res = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : undefined);
  if (!res.ok) throw new Error((await res.text()).slice(0, 200));
  return res.json();
};

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function verdicts() {
  return [...document.querySelectorAll("input.verdict:checked")].map((el) => el.value);
}

function query() {
  const p = new URLSearchParams({ limit: "400" });
  const state = $("#state").value, system = $("#system").value;
  if (state) p.set("state", state);
  if (verdicts().length) p.set("verdict", verdicts().join(","));
  if (system) p.set("system", system);
  if (window_ && window_ !== "all") p.set("window", window_);
  if ($("#hideseen").checked) p.set("hide_seen", "true");
  if ($("#hideforeign").checked) p.set("hide_foreign", "true");
  if ($("#q").value.trim()) p.set("q", $("#q").value.trim());
  return p.toString();
}

async function load(keep) {
  const data = await api("/boards/roles?" + query());
  rows = data.roles;
  const c = data.counts;
  fresh = data.fresh || {};
  // "to read" is under the filters that are on, not the whole table: the
  // table's own four thousand includes the rejects and the abroad ones and
  // is not a number of jobs anybody is going to open.
  $("#counts").textContent =
    `${rows.length} shown · ${fresh.all ?? "?"} under these filters · ` +
    `${c.roles} collected · ${c.already_known} already known · ${c.abroad} abroad`;
  paintDays();
  paintList();
  if (keep && current) {
    const i = rows.findIndex((r) => r.id === current.id);
    if (i >= 0) { at = i; markRow(); return; }
  }
  if (rows.length && at < 0) show(0);
  // An empty day is the normal case most mornings, so it says where the
  // work actually is rather than reading as a broken page.
  if (!rows.length) {
    const next = WINDOWS.filter(([k]) => k !== window_ && (fresh[k] || 0) > 0)
      .map(([k, label]) => `${fresh[k]} ${label === "everything" ? "in all" : label}`);
    $("#detail").innerHTML = `<div class="empty">Nothing posted ${window_ === "all" ? "at all" : esc(label(window_))} under these filters.` +
      (next.length ? `<br>Elsewhere: ${esc(next.join(" · "))}.` : " Crawl, or widen the filters.") + `</div>`;
  }
}

let fresh = {};
const label = (key) => (WINDOWS.find(([k]) => k === key) || ["", key])[1];

function paintDays() {
  // Each count is what is left **to read** in that window - nothing
  // decided, nothing already in autopilot, nowhere abroad, nothing the
  // rules threw out - so the number on the button is the number of jobs
  // the button is offering.
  $("#days").innerHTML = '<span class="lab">posted</span>' + WINDOWS.map(([key, text]) =>
    `<button data-w="${key}" class="${key === window_ ? "on" : ""}">${text}` +
    `${fresh[key] === undefined ? "" : ` <span class="n">${fresh[key]}</span>`}</button>`).join("");
  $("#days").querySelectorAll("button").forEach((el) =>
    el.addEventListener("click", () => { window_ = el.dataset.w; at = -1; load(false); }));
}

function paintList() {
  $("#list").innerHTML = rows.map((r, i) => `
    <div class="row ${i === at ? "on" : ""} ${r.state !== "new" ? "decided" : ""}" data-i="${i}">
      <div class="top">
        <span class="co">${esc(r.company || r.slug)}</span>
        <span class="ti">${esc(r.title)}</span>
        ${r.verdict ? `<span class="chip ${r.verdict}">${r.verdict}</span>` : ""}
      </div>
      <div class="meta">
        <span>${esc(r.location || "—")}</span>
        <span class="age ${age(r).old ? "old" : ""}">${esc(age(r).text)}</span>
        <span>${esc(r.system)}</span>
        ${r.seen_verdict ? `<span class="chip seen">${r.seen_verdict === "high" ? "already in autopilot" : "looks like a job of mine"}</span>` : ""}
        ${r.state !== "new" ? `<span class="chip ${r.state}">${r.state}</span>` : ""}
      </div>
    </div>`).join("") || '<div class="empty">No rows.</div>';
  $("#list").querySelectorAll(".row").forEach((el) =>
    el.addEventListener("click", () => show(Number(el.dataset.i))));
}

function age(r) {
  // "3d" reads faster than "2026-10-12" when the whole question is how
  // fresh this one is. Over a fortnight it is the date again, because by
  // then the exact day is what tells two month-old postings apart.
  const day = (r.posted || (r.found_at || "").slice(0, 10));
  if (!day) return { text: "no date", old: true };
  const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(day + "T00:00:00").getTime()) / 86400000);
  if (!isFinite(days)) return { text: day, old: true };
  if (days <= 0) return { text: "today", old: false };
  if (days === 1) return { text: "yesterday", old: false };
  if (days <= 14) return { text: days + "d", old: days > 7 };
  return { text: day, old: true };
}

function markRow() {
  $("#list").querySelectorAll(".row").forEach((el, i) => el.classList.toggle("on", i === at));
  const on = $("#list").querySelector(".row.on");
  if (on) on.scrollIntoView({ block: "nearest", behavior: "instant" });
}

async function show(i) {
  if (i < 0 || i >= rows.length) return;
  at = i; markRow();
  const role = await api("/boards/role/" + rows[i].id);
  current = role;
  const flags = (role.flags || []).map((f) => `<span class="chip reject">${esc(f)}</span>`).join("");
  $("#detail").innerHTML = `
    ${role.seen_verdict ? `<div class="applied">
        ${role.seen_verdict === "high" ? "ALREADY IN AUTOPILOT" : "LOOKS LIKE A JOB I ALREADY HAVE"}
        ${role.seen_job ? " · job " + esc(role.seen_job) : ""}
        ${role.state === "declined" && role.reason ? " · " + esc(role.reason) : ""}
      </div>` : ""}
    <h1>${esc(role.title)}</h1>
    <div class="sub">
      ${esc(role.company || role.slug)} · ${esc(role.location || "no place given")} ·
      ${esc(role.posted || "no date")} · ${esc(role.system)}
      ${role.verdict ? ` · <span class="chip ${role.verdict}">${role.verdict}</span>` : " · not screened"}
    </div>
    <div class="flags">${flags}</div>
    <div class="actions">
      <a href="${esc(role.url)}" target="_blank" rel="noopener"><button>Open the posting (o)</button></a>
      <button class="go" id="added">It is in autopilot (a)</button>
      <button class="no" id="decline">Decline (d)</button>
      <button id="recheck">Check again</button>
      ${role.state !== "new" ? `<button id="undo">Undo</button>` : ""}
    </div>
    <div class="text">${esc(role.text || "The board sent no description. Open the posting.")}</div>`;
  const on = (id, fn) => { const el = $("#" + id); if (el) el.addEventListener("click", fn); };
  on("added", () => decide("added", ""));
  on("decline", askDecline);
  on("undo", () => decide("new", ""));
  on("recheck", async () => {
    const answer = await api(`/boards/role/${role.id}/recheck`, {});
    await load(true);
    if (!answer.level) alert("Nothing in autopilot matches this one (" + answer.rule + ").");
    else show(at);
  });
}

async function decide(state, reason) {
  if (!current) return;
  await api(`/boards/role/${current.id}/decide`, { state, reason });
  const next = at;
  await load(false);
  if (state === "new") { show(Math.min(next, rows.length - 1)); return; }
  // The list is usually filtered to "to read", so the row leaves it and the
  // next role is already at this index.
  show(Math.min(next, rows.length - 1));
}

function askDecline() {
  const reason = prompt("Why not this one? (the reason is what tunes the filters)", "");
  if (reason === null) return;
  decide("declined", reason.trim());
}

async function paintSchedule() {
  // The daily crawl runs itself; the page says so, because a schedule
  // nobody can see is one nobody trusts.
  const s = (await api("/boards/stats")).schedule;
  if (!s) return;
  const when = (r) => (r && r.at ? new Date(r.at).toLocaleString() : "never");
  $("#scheduleline").textContent =
    `daily crawl ${s.running ? "scheduled" : s.enabled ? "not started" : "off"} · ` +
    `last crawl ${when(s.crawl)} · last harvest ${when(s.harvest)}` +
    (s.crawl_due ? " · a crawl is due" : "");
}

async function poll() {
  const run = await api("/boards/run");
  const line = $("#runline");
  const busy = run.state === "running";
  $("#harvest").disabled = busy;
  $("#crawl").disabled = busy;
  if (busy) {
    const p = run.progress || {};
    line.className = "runline";
    line.textContent = `${run.kind} running since ${run.started}` +
      (p.companies ? ` · ${p.companies} boards · ${p.at_level || 0} at level · ${p.new || 0} new · ${p.last || ""}` : "");
  } else if (run.state === "error") {
    line.className = "runline error";
    line.textContent = `${run.kind} failed: ${run.error}`;
  } else if (run.state === "done") {
    line.className = "runline";
    line.textContent = `${run.kind} finished ${run.done}: ${JSON.stringify(run.result).slice(0, 300)}`;
  } else {
    line.textContent = "";
  }
  if (busy !== poll.wasBusy) { poll.wasBusy = busy; if (!busy) { load(true); paintSchedule(); } }
  setTimeout(poll, busy ? 1500 : 5000);
}

$("#harvest").addEventListener("click", async () => {
  if (!confirm("Read the public job lists on GitHub and fold their companies into the registry?")) return;
  await api("/boards/harvest", {});
  poll();
});
$("#crawl").addEventListener("click", async () => {
  if (!confirm("Read every board in the registry. A few minutes, and nothing is applied for.")) return;
  await api("/boards/crawl", {});
  poll();
});
["state", "system", "hideseen", "hideforeign"].forEach((id) =>
  $("#" + id).addEventListener("change", () => { at = -1; load(false); }));
document.querySelectorAll("input.verdict").forEach((el) =>
  el.addEventListener("change", () => { at = -1; load(false); }));
let typing;
$("#q").addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(() => { at = -1; load(false); }, 250); });

addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey) return;
  if (e.key === "j") { show(at + 1); e.preventDefault(); }
  if (e.key === "k") { show(at - 1); e.preventDefault(); }
  if (e.key === "a") { decide("added", ""); }
  if (e.key === "d") { askDecline(); }
  if (e.key === "o" && current) { window.open(current.url, "_blank", "noopener"); }
  // The day is the first decision of a session, so it is a keystroke too:
  // 1 is today, 6 is everything, in the order the buttons stand.
  const pick = WINDOWS[Number(e.key) - 1];
  if (pick) { window_ = pick[0]; at = -1; load(false); e.preventDefault(); }
});

load(false);
poll();
paintSchedule();
</script>
