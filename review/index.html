// ---------------------------------------------------------------- Scout --
// Companies' own careers pages watched on a schedule; the new roles at the
// level land here and in the mail. Nothing is queued until "Add to
// autopilot" on a hit; a watch whose page cannot be read is BROKEN in red.
const Scout = (() => {
  let state = null;     // GET /scout
  let viewing = null;   // watch id when its hits are shown; null = every hit
  let busy = false;

  async function open() { await refresh(); render(); }

  async function refresh() {
    try { state = await api("/scout"); } catch (err) { state = { error: err.message, watches: [], hits: [], mail: {} }; }
  }

  async function poll() {
    if (busy || view !== "scout") return;
    await refresh();
    renderNav();
    // Hits can appear at any time; redraw the list only when the count moved.
    const shown = $("detail").dataset.hits;
    if (shown !== undefined && shown !== String(state.hits.length)) render();
  }

  function fmt(iso) {
    if (!iso) return "never";
    if (iso === "now") return "now";
    const d = new Date(iso); const mins = Math.round((d - Date.now()) / 60000);
    if (Math.abs(mins) < 60) return mins <= 0 ? `${-mins} min ago` : `in ${mins} min`;
    const h = Math.round(mins / 60);
    return h <= 0 ? `${-h} h ago` : `in ${h} h`;
  }

  function tone(w) { return w.broken ? "stop" : !w.enabled ? "done" : "agent"; }

  function renderNav() {
    const ws = state?.watches || [];
    const news = (state?.hits || []).filter((h) => h.status === "new");
    $("count").textContent = ws.length ? `${ws.length} watched · ${news.length} new` : "";
    $("list").innerHTML = `<button class="row" data-all aria-current="${viewing === null}" data-tone="you">
        <span class="role">Every hit</span><span class="cov">${news.length} new</span></button>` +
      (ws.length ? `<div class="group">Watching <span class="n">${ws.length}</span></div>` : "") +
      ws.map((w) => `
        <button class="row" data-id="${w.id}" data-tone="${tone(w)}" aria-current="${viewing === w.id}">
          <span class="role">${escape(w.company)}</span>
          <span class="cov">${w.broken ? '<span class="broken">Broken</span>' : !w.enabled ? "paused" :
            `${w.last_matching} at level · next ${escape(fmt(w.next_check))}`}</span>
        </button>`).join("");
    $("list").querySelector("[data-all]").onclick = () => { viewing = null; render(); };
    for (const b of $("list").querySelectorAll("button[data-id]")) b.onclick = () => { viewing = b.dataset.id; render(); };
  }

  function render() {
    renderNav();
    if (!state) return;
    const w = viewing && state.watches.find((x) => x.id === viewing);
    if (viewing && !w) { viewing = null; }
    $("detail").dataset.hits = state.hits.length;
    $("detail").innerHTML = (w ? renderWatch(w) : renderTop()) + renderHits(w);
    wire(w);
  }

  function renderTop() {
    const m = state.mail || {};
    return `
      <div class="head"><h2>Scout</h2></div>
      <p>Paste a company's careers page. It is read ${state.checks_per_day} times a day; every new role at your
      level is screened, listed here and mailed to you, with a note ready for the person who can refer you.
      Nothing is applied to: a hit enters autopilot only when you add it.</p>
      ${state.error ? `<div class="banner stop">${escape(state.error)}</div>` : ""}
      ${state.watches.some((x) => x.broken) ? `<div class="banner stop" style="font-size:15px"><span class="broken">Broken</span>
        <b>This company does not work: ${state.watches.filter((x) => x.broken).map((x) => escape(x.company)).join(", ")}.</b>
        The page could not be read; nothing there is watched until it reads again. Open it in the list, press Verify, or paste its new URL.</div>` : ""}
      <div class="card" style="padding:.6rem 1rem">
        <div class="scout-form">
          <textarea id="sUrl" class="wide" rows="1" placeholder="careers page URL, e.g. https://www.google.com/about/careers/applications/jobs/results?q=software+engineer&location=United+States"></textarea>
          <textarea id="sCompany" rows="1" placeholder="company (optional)"></textarea>
          <textarea id="sQuery" rows="1" placeholder="search text for the page (optional)"></textarea>
          <textarea id="sRef" class="wide" rows="1" placeholder="who can refer you there, e.g. Priya (WhatsApp)"></textarea>
        </div>
        <div class="actions">
          <button class="act primary" id="sAdd">Watch it</button>
          <span class="hint" id="sNote">Greenhouse, Lever, Ashby, Workday, SmartRecruiters, Oracle, Microsoft/Eightfold, Google, Amazon, Apple.</span>
        </div>
      </div>
      <h3>Schedule and mail</h3>
      <div class="card" style="padding:.6rem 1rem">
        <div class="actions">
          <label>Checks per day <input class="num" id="sFreq" type="number" min="1" max="48" value="${state.checks_per_day}"></label>
          <button class="act" id="sFreqGo">Set</button>
          <button class="act" id="sVerify">Verify every page</button>
          <button class="act" id="sCheck">Check every page now</button>
          <span class="hint" id="sStatus">${state.running ? "" : "the scout thread is off (AUTOPILOT_SCOUT=0)"}</span>
        </div>
        <p class="hint">Mail: ${m.configured ? `on, to ${escape((m.to || []).join(", "))} <button class="act small" id="sMail">Send a test</button>`
          : "not set up. AUTOPILOT_SMTP_USER and AUTOPILOT_SMTP_PASS in .env (Gmail: an App Password), then restart the server."}</p>
      </div>`;
  }

  function renderWatch(w) {
    return `
      <div class="head"><h2>${escape(w.company)}</h2></div>
      ${w.broken ? `<div class="banner stop" style="font-size:15px"><span class="broken">Broken</span> <b>This company does not work.</b> ${escape(w.error)}</div>` :
        `<p class="hint">${w.provider} · ${w.last_total} roles listed, ${w.last_matching} at your level ·
         checked ${escape(fmt(w.last_checked))} · next ${escape(fmt(w.next_check))}</p>`}
      <div class="card" style="padding:.6rem 1rem">
        <table class="kv">
          <tr><td>Page</td><td><a href="${escape(w.url)}" target="_blank" rel="noopener">${escape(w.url)}</a></td></tr>
          <tr><td>Search text</td><td><textarea id="wQuery" rows="1" style="min-height:2.2rem">${escape(w.query)}</textarea></td></tr>
          <tr><td>Referrer</td><td><textarea id="wRef" rows="1" style="min-height:2.2rem">${escape(w.referrer)}</textarea></td></tr>
          <tr><td>Title must have one of</td><td><textarea id="wPos" rows="2">${escape(w.positive.join(", "))}</textarea></td></tr>
          <tr><td>and none of</td><td><textarea id="wNeg" rows="2">${escape(w.negative.join(", "))}</textarea></td></tr>
          <tr><td>Checks per day</td><td><input class="num" id="wFreq" type="number" min="1" max="48" value="${w.checks_per_day || ""}" placeholder="${w.checks_per_day_effective}"> <span class="hint">blank = the global ${state.checks_per_day}</span></td></tr>
        </table>
        <div class="actions">
          <button class="act primary" id="wSave">Save</button>
          <button class="act" id="wVerify">Verify</button>
          <button class="act" id="wCheck">Check now</button>
          <button class="act" id="wPause">${w.enabled ? "Pause" : "Resume"}</button>
          <button class="act danger" id="wDel">Stop watching</button>
          <span class="hint" id="wNote"></span>
        </div>
      </div>`;
  }

  function renderHits(w) {
    const hits = (state.hits || []).filter((h) => !w || h.watch_id === w.id);
    const fresh = hits.filter((h) => h.status === "new"), rest = hits.filter((h) => h.status !== "new");
    const card = (h) => `
      <div class="hit ${h.status !== "new" ? "done" : ""}" data-hit="${h.id}">
        <div class="t"><a href="${escape(h.posting.url)}" target="_blank" rel="noopener">${escape(h.posting.title)}</a>
          <span class="hint">· ${escape(h.company)}</span></div>
        <div class="m">${escape(h.posting.location || "")}${h.posting.posted ? ` · posted ${escape(h.posting.posted)}` : ""}
          · found ${escape(fmt(h.found_at))} · <span class="v-${escape(h.verdict)}">${escape(h.verdict || "not screened")}</span>
          ${h.summary ? ` — ${escape(h.summary)}` : ""}${h.status === "queued" ? " · in autopilot" : h.status === "dismissed" ? " · dismissed" : ""}</div>
        ${h.referrer ? `<pre class="note">${escape(h.note)}</pre>` : ""}
        ${h.status === "new" ? `<div class="actions">
          <button class="act primary" data-queue="${h.id}">Add to autopilot</button>
          ${h.referrer ? `<button class="act" data-copy="${h.id}">Copy the note</button>` : ""}
          <button class="act" data-dismiss="${h.id}">Dismiss</button></div>` :
          h.job_id ? `<div class="actions"><button class="act" data-open="${h.job_id}">Open the job</button></div>` : ""}
      </div>`;
    return `<h3>New · ${fresh.length}</h3>
      <div class="card">${fresh.map(card).join("") || `<p class="empty" style="padding:1rem">Nothing new${w ? "" : " on any page"}. The first check of a page only remembers what is there; from then on every new role at your level shows here.</p>`}</div>
      ${rest.length ? `<details><summary>Handled · ${rest.length}</summary><div class="card">${rest.map(card).join("")}</div></details>` : ""}`;
  }

  async function call(path, options, note, onDone) {
    busy = true;
    if (note) note.textContent = "…";
    try {
      const out = await api(path, options);
      if (note) note.textContent = "";
      await onDone?.(out);
    } catch (err) { if (note) note.textContent = err.message; else alert(err.message); }
    busy = false;
  }

  function wire(w) {
    if (!w) {
      $("sAdd").onclick = () => {
        const url = $("sUrl").value.trim();
        if (!url) return;
        call("/scout/watch", { method: "POST", body: JSON.stringify({ url, company: $("sCompany").value,
          query: $("sQuery").value.trim() || null, referrer: $("sRef").value }) }, $("sNote"), async (out) => {
            const v = out.verify;
            if (v && !v.ok) alert(`Watching, but the page could not be read: ${v.error}`);
            else if (v) alert(`Watching ${out.watch.company}: ${v.total} roles listed, ${v.matching} at your level.${v.matching ? "\n" + v.sample.slice(0, 5).join("\n") : "\nNone match the title filter; open the watch and loosen it."}`);
            viewing = out.watch.id; await refresh(); render(); });
      };
      $("sFreqGo").onclick = () => call("/scout/frequency", { method: "POST", body: JSON.stringify({ checks_per_day: Number($("sFreq").value) }) }, $("sStatus"), async () => { await refresh(); render(); });
      $("sVerify").onclick = () => call("/scout/verify", { method: "POST" }, $("sStatus"), async (out) => {
        await refresh(); render();
        $("sStatus").textContent = out.broken ? `${out.broken} broken` : `all ${out.results.length} pages read`; });
      $("sCheck").onclick = () => call("/scout/check", { method: "POST" }, $("sStatus"), async (out) => {
        await refresh(); render();
        const fresh = Object.values(out.results).reduce((n, r) => n + (r.new || 0), 0);
        $("sStatus").textContent = `${fresh} new` + (out.mail.sent ? `, mailed` : out.mail.reason ? ` (${out.mail.reason})` : ""); });
      if ($("sMail")) $("sMail").onclick = () => call("/scout/mail/test", { method: "POST" }, null, (out) => alert(`Sent to ${out.to.join(", ")}`));
    } else {
      const lists = (id) => $(id).value.split(",").map((x) => x.trim()).filter(Boolean);
      $("wSave").onclick = () => call(`/scout/watch/${w.id}`, { method: "PATCH", body: JSON.stringify({
        query: $("wQuery").value.trim(), referrer: $("wRef").value.trim(), positive: lists("wPos"), negative: lists("wNeg"),
        checks_per_day: $("wFreq").value ? Number($("wFreq").value) : null }) }, $("wNote"), async () => { await refresh(); render(); });
      $("wVerify").onclick = () => call(`/scout/watch/${w.id}/verify`, { method: "POST" }, $("wNote"), async (out) => {
        await refresh(); render();
        $("wNote").textContent = out.ok ? `${out.total} listed, ${out.matching} at your level` + (out.sample.length ? `: ${out.sample.slice(0, 3).join(" · ")}` : "") : out.error; });
      $("wCheck").onclick = () => call(`/scout/watch/${w.id}/check`, { method: "POST" }, $("wNote"), async (out) => {
        await refresh(); render();
        $("wNote").textContent = out.ok ? `${out.new} new` + (out.mail?.sent ? ", mailed" : "") : out.error; });
      $("wPause").onclick = () => call(`/scout/watch/${w.id}`, { method: "PATCH", body: JSON.stringify({ enabled: !w.enabled }) }, $("wNote"), async () => { await refresh(); render(); });
      $("wDel").onclick = () => { if (confirm(`Stop watching ${w.company}? Its hits go too.`))
        call(`/scout/watch/${w.id}`, { method: "DELETE" }, $("wNote"), async () => { viewing = null; await refresh(); render(); }); };
    }
    for (const b of $("detail").querySelectorAll("[data-queue]")) b.onclick = () =>
      call(`/scout/hits/${b.dataset.queue}/queue`, { method: "POST" }, null, async () => { await refresh(); render(); });
    for (const b of $("detail").querySelectorAll("[data-dismiss]")) b.onclick = () =>
      call(`/scout/hits/${b.dataset.dismiss}/dismiss`, { method: "POST" }, null, async () => { await refresh(); render(); });
    for (const b of $("detail").querySelectorAll("[data-copy]")) b.onclick = () => {
      const hit = state.hits.find((h) => h.id === b.dataset.copy);
      navigator.clipboard?.writeText(hit.note).then(() => { b.textContent = "Copied"; });
    };
    for (const b of $("detail").querySelectorAll("[data-open]")) b.onclick = () => { location.hash = b.dataset.open; switchView("jobs"); };
  }

  return { open, poll };
})();


// ------------------------------------------------------------- Projects --
// A GitHub handle in, the public repositories ranked, the ticked ones
// handed to the interviewer. The scan runs on the server; this polls.
const Projects = (() => {
  let state = null;     // GET /projects
  let viewing = null;   // repo name when reading one
  let busy = false;
  let started = true;   // the profile interview exists; the projects join it

  async function open() {
    viewing = null;
    await refresh();
    render();
  }

  async function refresh() {
    try { state = await api("/projects"); } catch (err) { state = { phase: "error", error: err.message, repos: [], issues: [] }; }
    try { started = (await api("/profile")).phase !== "new"; } catch (_) { started = true; }
  }

  async function poll() {
    if (busy || view !== "projects" || !state) return;
    const moving = state.phase === "scanning" || state.repos.some((r) => r.state === "listed" || r.state === "reading");
    if (!moving) return;
    await refresh();
    render();
  }

  function render() {
    renderNav();
    if (!state) return;
    if (viewing) return renderRepo();
    if (state.phase === "new" || state.phase === "error" || !state.repos.length) return renderStart();
    renderPicks();
  }

  function tone(r) {
    if (r.slug) return "done";
    if (r.state === "error") return "stop";
    if (r.state === "reading" || r.state === "listed") return "agent";
    return r.picked ? "you" : "done";
  }

  function note(r) {
    if (r.slug) return '<span class="ok">in the interview</span>';
    if (r.state === "error") return '<span class="err">not read</span>';
    if (r.state === "reading") return '<span class="pend">reading…</span>';
    if (r.state === "listed") return "queued";
    return escape(r.summary || r.description || r.language || "");
  }

  function renderNav() {
    const repos = state?.repos || [];
    if (!repos.length) {
      $("list").innerHTML = state?.handle ? `<div class="group">${escape(state.handle)}</div>` : "";
      $("count").textContent = "";
      return;
    }
    $("list").innerHTML = `<div class="group">${escape(state.handle)} <span class="n">${repos.length}</span></div>` +
      repos.map((r) => `
        <button class="row" data-name="${escape(r.name)}" data-tone="${tone(r)}" aria-current="${viewing === r.name}">
          <span class="role">${r.rank ? `#${r.rank} ` : ""}${escape(r.name)}</span>
          <span class="cov">${note(r)}</span>
        </button>`).join("");
    for (const button of $("list").querySelectorAll("button[data-name]")) {
      button.onclick = () => { viewing = button.dataset.name; render(); };
    }
    const ready = repos.filter((r) => r.state === "ready").length;
    $("count").textContent = state.phase === "scanning" ? `${ready}/${repos.length} read` : `${repos.length} repositories`;
  }

  function renderStart() {
    $("detail").innerHTML = `
      <div class="head"><h2>Projects from GitHub</h2></div>
      <p>Give me a GitHub handle and I read every public repository on it: the README, the
      file tree, the manifests, the heads of a few files, and how many commits are yours.
      Each one gets a short write-up, the list is ranked, and the best ten are ticked. Confirm
      the ticks and the interviewer asks one to three questions per project, only what GitHub
      cannot tell. A repository whose name matches a project on the resume becomes that project.
      The link on each one is what the resume hyperlinks; change it here when the store listing
      or a live site is the better address.</p>
      ${state.error ? `<div class="banner stop">${escape(state.error)}</div>` : ""}
      <div class="actions">
        <textarea id="handle" rows="1" style="min-height:2.6rem;max-width:22rem" placeholder="github handle">${escape(state.handle || "")}</textarea>
        <button class="act primary" id="scan">Read the repositories</button>
        <span class="hint">Public repositories only. Around a minute per ten.</span>
      </div>`;
    $("scan").onclick = () => scan();
    $("handle").onkeydown = (event) => { if (event.key === "Enter") { event.preventDefault(); scan(); } };
  }

  async function scan() {
    const handle = $("handle").value.trim();
    if (!handle) return;
    busy = true;
    try {
      state = await api("/projects/scan", { method: "POST", body: JSON.stringify({ handle }) });
      render();
    } catch (err) { alert(err.message); }
    busy = false;
  }

  function renderPicks() {
    const repos = state.repos;
    const scanning = state.phase === "scanning";
    const ready = repos.filter((r) => r.state === "ready").length;
    const ticked = repos.filter((r) => r.picked && !r.slug);
    const added = repos.filter((r) => r.slug).length;
    const confirmable = started && !scanning && ticked.length && ticked.every((r) => r.state === "ready");
    $("detail").innerHTML = `
      <div class="head"><h2>${escape(state.handle)}</h2>
        <span class="co">${scanning ? `reading · ${ready}/${repos.length}` : `${repos.length} repositories · ${added} in the interview`}</span></div>
      ${state.error ? `<div class="banner stop">${escape(state.error)}</div>` : ""}
      ${scanning ? `<div class="banner warn">Reading the repositories, best first. Tick and untick while it runs; confirm once it is done.</div>` : ""}
      ${started ? "" : `<div class="banner warn">Start the profile interview first (Profile tab); the projects join it.</div>`}
      <p class="hint">The best ${state.auto_pick} are ticked: newest, most worked on, starred, documented. An old project
      that matters still belongs here; tick it. Click a row on the left to read what was found and to change its link.</p>
      <div class="card" style="padding:.4rem .8rem">${repos.map((r) => `
        <label style="display:flex;gap:.7rem;align-items:baseline;padding:.35rem 0;border-bottom:1px solid var(--line)">
          <input type="checkbox" data-pick="${escape(r.name)}" ${r.picked || r.slug ? "checked" : ""} ${r.slug || r.state === "error" ? "disabled" : ""}>
          <span style="color:var(--muted);min-width:2.2rem">#${r.rank || "–"}</span>
          <span style="flex:1;min-width:0">
            <strong>${escape(r.name)}</strong>
            <span class="hint" style="margin-left:.5rem">${r.language ? escape(r.language) + " · " : ""}${r.pushed_at ? "pushed " + escape(r.pushed_at.slice(0, 10)) : ""}${r.commits >= 0 ? " · " + r.commits + " commits" : ""}${r.stars ? " · ★" + r.stars : ""}</span>
            <br><span class="hint">${r.on_resume ? `<span class="ok">on the resume as ${escape(r.on_resume)}</span> · ` : ""}${note(r)}</span>
          </span>
        </label>`).join("")}</div>
      <div class="actions">
        <button class="act primary" id="confirm" ${confirmable ? "" : "disabled"}>Add ${ticked.length} to the interview</button>
        <button class="act" id="rescan" ${scanning ? "disabled" : ""}>Scan again</button>
        <span class="hint">${added ? "The Profile tab asks about the added ones." : ""}</span>
      </div>
      ${state.issues?.length ? `<details><summary>Skipped · ${state.issues.length}</summary><ul>${state.issues.map((i) => `<li>${escape(i)}</li>`).join("")}</ul></details>` : ""}`;
    for (const box of $("detail").querySelectorAll("input[data-pick]")) {
      box.onchange = async () => {
        try { state = await api(`/projects/${encodeURIComponent(box.dataset.pick)}/pick`, { method: "POST", body: JSON.stringify({ picked: box.checked }) }); }
        catch (err) { alert(err.message); }
        render();
      };
    }
    $("confirm").onclick = async () => {
      busy = true;
      $("confirm").disabled = true; $("confirm").textContent = "Adding…";
      try {
        state = await api("/projects/confirm", { method: "POST", body: "{}" });
        render();
        if (confirm("Added. Open the Profile tab and answer their questions now?")) switchView("profile");
      } catch (err) { alert(err.message); render(); }
      busy = false;
    };
    $("rescan").onclick = () => { state = { ...state, phase: "new", repos: [] }; render(); };
  }

  async function renderRepo() {
    const r = state.repos.find((x) => x.name === viewing);
    if (!r) { viewing = null; return render(); }
    $("detail").innerHTML = `
      <div class="head"><h2>${escape(r.name)}</h2><span class="co">${r.rank ? `#${r.rank} · ` : ""}${escape(r.full_name)}</span></div>
      <div class="actions">
        <button class="act" id="back">← All repositories</button>
        ${r.slug ? `<span class="hint">In the interview as <strong>${escape(r.slug)}</strong>.</span>` : ""}
      </div>
      ${r.error ? `<div class="banner stop">${escape(r.error)}</div>` : ""}
      <h3>Link on the resume</h3>
      <div class="actions">
        <textarea id="link" rows="1" style="min-height:2.6rem;max-width:40rem">${escape(r.url)}</textarea>
        <button class="act" id="saveLink">Save</button>
        <a href="${escape(r.url)}" target="_blank" rel="noopener" class="hint">open ↗</a>
      </div>
      <p class="hint">The repository by default. A store listing or a live site works as well; whatever is here is what the tailored resume links.</p>
      ${r.questions?.length ? `<h3>The interviewer will ask</h3><ul>${r.questions.map((q) => `<li>${escape(q)}</li>`).join("")}</ul>` : ""}
      <h3>What was found</h3>
      <div class="card doc" id="doc">${r.state === "ready" ? "loading…" : r.state === "error" ? "Not read." : "Not read yet."}</div>`;
    $("back").onclick = () => { viewing = null; render(); };
    $("saveLink").onclick = async () => {
      try {
        state = await api(`/projects/${encodeURIComponent(r.name)}/link`, { method: "POST", body: JSON.stringify({ link: $("link").value }) });
        render();
      } catch (err) { alert(err.message); }
    };
    if (r.state === "ready") {
      const text = await fetch(`/projects/${encodeURIComponent(r.name)}/scaffold`).then((x) => x.text());
      if ($("doc") && viewing === r.name) $("doc").innerHTML = Profile.docMarkdown(text);
    }
  }

  return { open, poll };
})();

// ------------------------------------------------------- Preliminary form --
// The fixed questions every application asks, one per screen, no model.
// Writes base/form.json through /profile/form; the code filler reads it.
const Form = (() => {
  let data = null;      // GET /profile/form
  let values = {};
  let corrections = {};  // label -> {value, was, system, field, when, job}
  let step = 0;         // index into asked (questions with a key, not fixed)
  let asked = [];

  async function open() {
    Profile.setViewing({ slug: "_form", name: "form.json" });
    try { data = await api("/profile/form"); } catch (err) { $("detail").innerHTML = `<div class="banner stop">${escape(err.message)}</div>`; return; }
    values = { ...data.values };
    corrections = { ...data.corrections };
    asked = data.questions.filter((q) => q.key && !q.fixed);
    for (const q of asked) if (!values[q.key] && q.default) values[q.key] = q.default;
    if (data.exists) summary(); else { step = 0; hints(); ask(); }
  }

  // Contact details the resume already carries, filled in where empty.
  async function hints() {
    try {
      const { hints } = await api("/profile/form/hints");
      for (const [k, v] of Object.entries(hints || {})) if (!values[k] && v) values[k] = v;
      if ($("qinput") && !$("qinput").value && values[asked[step]?.key]) $("qinput").value = values[asked[step].key];
    } catch (_) { /* hints are a convenience */ }
  }

  function sectionOf(q) {
    let sec = "";
    for (const item of data.questions) { if (item.section) sec = item.section; if (item === q) break; }
    return sec;
  }

  function ask() {
    const q = asked[step];
    const value = values[q.key] || "";
    const control = q.kind === "select"
      ? `<select id="qinput"><option value="">—</option>${q.options.map((o) => `<option ${o === value ? "selected" : ""}>${escape(o)}</option>`).join("")}</select>`
      : q.kind === "yesno"
      ? `<div class="choices">${["Yes", "No"].map((o) => `<button class="act" data-choice="${o}" aria-pressed="${o === value}">${o}</button>`).join("")}</div>`
      : `<input type="text" id="qinput" value="${escape(value)}" autocomplete="off">`;
    $("detail").innerHTML = `
      <div class="head"><h2>Preliminary interview</h2><span class="co">${step + 1} of ${asked.length} · Enter for next, blank to skip</span></div>
      <div class="card qform">
        <div class="prog"><i style="width:${Math.round(100 * step / asked.length)}%"></i></div>
        <div class="sec">${escape(sectionOf(q))}</div>
        <div class="q">${escape(q.ask)}</div>
        ${control}
        ${q.help ? `<div class="hint">${escape(q.help)}</div>` : ""}
        ${q.protected ? `<div class="prot">Kept on file for you and the screen. The filler never answers this on a form; you do.</div>` : ""}
        <div class="actions">
          <button class="act" id="qBack" ${step ? "" : "disabled"}>← Back</button>
          <button class="act primary" id="qNext">${step + 1 === asked.length ? "Finish" : "Next →"}</button>
          <button class="act" id="qSkip">Skip</button>
          <button class="act" id="qQuit">Save and stop</button>
        </div>
      </div>`;
    const input = $("qinput");
    if (input) { input.focus(); if (input.select) input.select(); }
    const read = () => { if (input) values[q.key] = input.value.trim(); };
    for (const b of $("detail").querySelectorAll("[data-choice]")) b.onclick = () => { values[q.key] = b.dataset.choice; next(); };
    $("qNext").onclick = () => { read(); next(); };
    $("qSkip").onclick = () => { values[q.key] = ""; next(); };
    $("qBack").onclick = () => { read(); step--; ask(); };
    $("qQuit").onclick = () => { read(); save(); };
    if (input) input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); read(); next(); } };
  }

  function next() {
    if (step + 1 < asked.length) { step++; ask(); } else save();
  }

  async function save() {
    try {
      data = await api("/profile/form", { method: "POST", body: JSON.stringify({ values, corrections }) });
      values = { ...data.values }; corrections = { ...data.corrections };
      Profile.form = data;
      summary();
    } catch (err) { alert(err.message); }
  }

  function summary() {
    const rows = data.questions.map((q) => q.section
      ? `<tr><td colspan="2" class="sec" style="padding-top:.9rem">${escape(q.section)}</td></tr>`
      : `<tr><td>${escape(q.ask)}</td><td class="${values[q.key] ? "" : "empty"}">${escape(values[q.key] || "not answered")}</td></tr>`).join("");
    // Newest first: the row that just landed is the one being checked.
    const corrected = Object.entries(corrections).sort((a, b) => String(b[1].when || "").localeCompare(String(a[1].when || "")));
    $("detail").innerHTML = `
      <div class="head"><h2>Form details</h2><span class="co">${data.answered}/${data.total} on file · base/form.json</span></div>
      <div class="actions">
        <button class="act" id="qClose">← Back</button>
        <button class="act primary" id="qRedo">Go through the questions</button>
      </div>
      <div class="card" style="padding:.6rem 1rem"><table class="kv">${rows}</table></div>
      <h3 style="margin-top:1.4rem">Corrected fields · ${corrected.length}</h3>
      <p class="hint">A field you changed on a form before submitting. On every next form that asks it, the value you set goes over what autofill put there. Delete a row to stop that.</p>
      <div class="card" style="padding:.6rem 1rem"><table class="kv corr" id="corrTable">
        ${corrected.length ? `<tr class="th"><td>Field</td><td>Form filled</td><td>You corrected</td><td>Where</td><td></td></tr>` : ""}
        ${corrected.map(([k, r]) => `<tr>
          <td title="${escape(fieldTitle(r))}">${escape(k)}</td>
          <td class="${r.was ? "was" : "empty"}">${escape(r.was || "blank")}</td>
          <td>${escape(r.value)}</td>
          <td class="empty">${escape([r.system, r.when].filter(Boolean).join(" · ") || "—")}</td>
          <td><button class="act" data-del="${escape(k)}">✕</button></td></tr>`).join("")
          || `<tr><td class="empty" colspan="5">nothing yet — fill a form, fix what is wrong, submit</td></tr>`}
      </table></div>`;
    $("qClose").onclick = () => Profile.back();
    $("qRedo").onclick = () => { step = 0; ask(); };
    for (const b of $("detail").querySelectorAll("[data-del]")) b.onclick = () => { delete corrections[b.dataset.del]; save(); };
  }

  // The control the correction was read off, for the hover: which input
  // on which system, so two forms wording one question alike can be told apart.
  function fieldTitle(r) {
    const f = r.field || {};
    return [f.kind, f.id && `#${f.id}`, f.name && `name=${f.name}`, r.job && `from ${r.job}`].filter(Boolean).join(" ");
  }

  return { open };
})();

// ---------------------------------------------------------------- Profile --
// The interviewer. Text goes over SSE; voice is optional on both ends and
// falls back to the browser's own speech APIs when the local binaries are
// not there. The interview loop is the same either way.
const Profile = (() => {
  let state = null;       // GET /profile
  let form = null;        // GET /profile/form, for the nav line
  let voice = null;       // GET /voice/status
  let busy = false;       // a turn is streaming
  let viewing = null;     // {slug, name} when reading a document
  // The chat is the voice: every reply is spoken, the mic reopens after
  // each one, and the transcript is the same text either way. The orb
  // pauses it; typing still works while paused.
  const speak = true;
  let paused = false;
  let listenNext = false; // reopen the mic once the reply has been spoken

  async function open() {
    viewing = null;
    await Promise.all([refresh(), refreshVoice()]);
    render();
    greet();
  }

  // Leaving the chat: nothing keeps talking or listening behind another view.
  function leave() {
    listenNext = false;
    Voice.interrupt();
    Voice.cancelListening();
  }

  // Entering the chat: the open question is spoken, then the mic opens.
  function greet() {
    if (!state || state.error || viewing || state.phase === "new" || busy || paused) return;
    const last = [...state.transcript].reverse().find((m) => m.role === "assistant");
    listenNext = true;
    if (last) say(last.content); else speechDone();
  }

  async function refresh() {
    try { state = await api("/profile"); } catch (err) { state = { error: err.message }; }
    try { form = await api("/profile/form"); } catch (_) { form = null; }
  }
  async function refreshVoice() {
    try { voice = await api("/voice/status"); } catch (_) { voice = null; }
  }

  // Cheap poll: children generation and downloads finish in the background.
  async function poll() {
    if (busy || view !== "profile") return;
    const pending = state?.experiences?.some((e) => e.children === "pending");
    const downloading = voice?.downloading;
    if (!pending && !downloading) return;
    await Promise.all([pending ? refresh() : null, downloading ? refreshVoice() : null]);
    renderNav();
    renderVoiceBar();
  }

  function render() {
    renderNav();
    if (!state) return;
    if (state.error) {
      $("detail").innerHTML = `<div class="banner stop">${escape(state.error)}</div>`;
      return;
    }
    if (viewing) return renderDocument();
    if (state.phase === "new") { leave(); return renderStart(); }
    renderChat();
  }

  function renderNav() {
    if (!state || !state.experiences) { $("list").innerHTML = ""; return; }
    const groups = [["role", "Roles"], ["project", "Projects"]];
    const factsNote = state.has_facts ? "on file" : state.phase === "facts"
      ? `asking · ${state.facts?.asked || 0}/${state.facts?.total || 0}` : "not yet";
    const formNote = form ? (form.exists ? `${form.answered}/${form.total} on file` : "not yet") : "";
    let html = `<div class="group">Facts</div>
      <button class="row" data-facts="1" data-tone="${state.has_facts ? "done" : "you"}" aria-current="${viewing?.slug === "_facts"}">
        <span class="role">About you</span>
        <span class="cov">${escape(factsNote)}</span>
      </button>
      <button class="row" data-form="1" data-tone="${form?.exists ? "done" : "you"}" aria-current="${viewing?.slug === "_form"}">
        <span class="role">Form details</span>
        <span class="cov">${escape(formNote)}</span>
      </button>`;
    for (const [kind, heading] of groups) {
      const items = state.experiences.filter((e) => e.kind === kind);
      if (!items.length) continue;
      html += `<div class="group">${heading} · ${items.length}</div>`;
      html += items.map((e) => `
        <button class="row" data-slug="${escape(e.slug)}" data-tone="${rowTone(e)}"
                aria-current="${viewing ? viewing.slug === e.slug : e.slug === state.current}">
          <span class="role">${escape(e.title)}</span>
          <span class="cov">${coverage(e)}</span>
        </button>`).join("");
    }
    $("list").innerHTML = html;
    for (const button of $("list").querySelectorAll("button[data-slug]")) {
      button.onclick = () => openDocument(button.dataset.slug, "main.md");
    }
    $("list").querySelector("button[data-facts]").onclick = () => openFacts();
    $("list").querySelector("button[data-form]").onclick = () => Form.open();
    $("count").textContent = state.experiences.length
      ? `${state.experiences.filter((e) => e.closed).length}/${state.experiences.length} experiences done`
      : "";
  }

  // Row colour: purple while the agent writes, green when it is your turn
  // (asking now, or not started), plain once the documents are on file.
  function rowTone(e) {
    if (e.children === "pending") return "agent";
    if (e.closed) return "done";
    return "you";
  }

  function coverage(e) {
    const cov = e.total ? `${e.covered}/${e.total} covered` : "not started";
    if (!e.closed) return e.slug === state.current ? `${cov} · asking now` : cov;
    const child = { none: "", pending: '<span class="pend">writing documents…</span>',
      ready: '<span class="ok">documents ready</span>',
      error: '<span class="err">documents failed</span>' }[e.children] || "";
    return `${cov}${child ? " · " + child : ""}`;
  }

  function renderStart() {
    $("detail").innerHTML = `
      <div class="head"><h2>Profile interview</h2></div>
      <p>I read your resume, then ask two things. First the facts it cannot tell me — work
      authorisation, clearance, level, relocation, start date — eight short questions that
      become the file the auto-reject screen and the form fill read. Then your stories: each
      role and project, one at a time, the way an interviewer would. Those become one document
      per experience; the tailor swaps in the right story for each posting, and you get a STAR
      write-up to reread before interviews. Stop any time; the next question picks up where you
      left off.</p>
      ${state.has_resume ? "" : `<div class="banner stop">No resume found. The interview starts from the resume.</div>`}
      <h3>Anything else to hand over (optional)</h3>
      <textarea id="seed" placeholder="Notes, an old resume, a project README… pasted here or picked below (PDF, text, markdown; several files are fine). Used once to find experiences, then discarded."></textarea>
      <div class="actions">
        <label class="act filepick" for="seedFile">Choose files (PDF, text, markdown)</label>
        <input type="file" id="seedFile" accept=".pdf,.txt,.md,.tex,application/pdf,text/plain,text/markdown" multiple>
        <span class="hint" id="seedNote">No file chosen</span>
      </div>
      <div class="actions">
        <button class="act primary" id="startInterview" ${state.has_resume ? "" : "disabled"}>Start the interview</button>
        <button class="act" id="startForm">Preliminary interview</button>
        <span class="hint">Form details first: the fixed questions every application asks, click-through, no voice.</span>
      </div>`;
    $("startForm").onclick = () => Form.open();
    // Files go to the server for text extraction (PDFs need pypdf); each
    // lands in the box under its own heading so the model knows what is what.
    $("seedFile").onchange = async (event) => {
      const files = [...event.target.files];
      const note = $("seedNote");
      note.textContent = `Reading ${files.length} file${files.length === 1 ? "" : "s"}…`;
      const failed = [];
      for (const file of files) {
        try {
          const res = await fetch("/profile/seed-file", { method: "POST",
            headers: { "X-Filename": file.name, "Content-Type": "application/octet-stream" }, body: file });
          const body = await res.json();
          if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
          $("seed").value = [$("seed").value.trim(), `## ${file.name}\n\n${body.text.trim()}`]
            .filter(Boolean).join("\n\n");
        } catch (err) { failed.push(`${file.name}: ${err.message}`); }
      }
      const total = $("seed").value.length;
      note.textContent = (failed.length ? failed.join("; ") + ". " : "")
        + `${total.toLocaleString()} characters${total > 40000 ? " (only the first 40,000 are used)" : ""}.`;
      event.target.value = "";
    };
    $("startInterview").onclick = async () => {
      const button = $("startInterview");
      button.disabled = true; button.textContent = "Reading the resume…";
      try {
        const result = await api("/profile/start", { method: "POST", body: JSON.stringify({ seed: $("seed").value }) });
        state = result.status;
        render();
        listenNext = true;
        say(result.message);
      } catch (err) { alert(err.message); button.disabled = false; button.textContent = "Start the interview"; }
    };
  }

  function renderChat() {
    const title = state.phase === "open" ? "All experiences covered — tell me anything new"
      : state.phase === "setup" ? "Before the stories"
      : state.phase === "facts" ? "About you"
      : (state.experiences.find((e) => e.slug === state.current) || {}).title || "Interview";
    const sub = { facts: `facts · ${state.facts?.asked || 0}/${state.facts?.total || 0}`, setup: "checking the list",
                  interviewing: "interviewing", open: "listening for updates" }[state.phase] || "";
    $("detail").innerHTML = `
      <div class="head"><h2>${escape(title)}</h2>
        <span class="co">${escape(sub)}</span>
        ${state.phase === "facts" ? `<button class="act" id="skipFacts">Skip to the stories</button>` : ""}
        <button class="act" id="openForm">Preliminary interview</button></div>
      <div class="voicebar" id="voicebar"></div>
      <div class="chat" id="chat">${state.transcript.map((m) =>
        `<div class="msg ${m.role === "user" ? "user" : "bot"}">${escape(m.content)}</div>`).join("")}</div>
      <div class="composer">
        <textarea id="say" placeholder="Talk, or type here. Enter sends; Shift+Enter is a new line."></textarea>
        <button class="act primary" id="send">Send</button>
      </div>
      ${orbHtml()}`;
    $("openForm").onclick = () => Form.open();
    renderVoiceBar();
    if ($("skipFacts")) $("skipFacts").onclick = () => skipFacts();
    $("send").onclick = () => send($("say").value);
    $("say").onkeydown = (event) => {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send($("say").value); }
    };
    wireOrb();
    scrollChat();
  }

  function orbHtml() {
    return `<div class="orbwrap" id="orbwrap">
      <div class="orb ${paused ? "paused" : "idle"}" id="orb" title="${paused ? "Tap to resume" : "Tap to pause"}">
        ${Bubble.svg()}
        <span class="orblabel" id="orblabel">${paused ? "Paused" : ""}</span></div></div>`;
  }

  function wireOrb() {
    Voice.setHandsFree(true);
    Bubble.attach($("orb"));
    placeOrb();
    dragOrb($("orb"), $("orbwrap"));
  }

  // The orb goes where it was last dropped, kept inside the window.
  window.addEventListener("resize", () => { if ($("orbwrap")) placeOrb(); });
  function placeOrb() {
    const wrap = $("orbwrap");
    if (!wrap) return;
    let pos = null;
    try { pos = JSON.parse(localStorage.getItem("orbpos") || "null"); } catch (_) {}
    if (!pos) return;
    const size = wrap.offsetWidth || 112;
    const x = Math.max(0, Math.min(window.innerWidth - size, pos.x)), y = Math.max(0, Math.min(window.innerHeight - size, pos.y));
    Object.assign(wrap.style, { left: `${x}px`, top: `${y}px`, right: "auto", bottom: "auto" });
  }

  // Drag the bubble anywhere; a press that barely moves is the pause tap.
  // While it moves the trailing side swells, like something pushed through
  // air, and it settles with a little wobble on drop.
  function dragOrb(orb, wrap) {
    let start = null, last = null, moved = false;
    orb.onpointerdown = (event) => {
      if (event.button !== 0) return;
      const rect = wrap.getBoundingClientRect();
      start = { x: event.clientX, y: event.clientY, left: rect.left, top: rect.top };
      last = { x: event.clientX, y: event.clientY, t: performance.now() };
      moved = false;
      orb.setPointerCapture(event.pointerId);
      event.preventDefault();
    };
    orb.onpointermove = (event) => {
      if (!start) return;
      const dx = event.clientX - start.x, dy = event.clientY - start.y;
      if (!moved && Math.hypot(dx, dy) < 6) return;
      moved = true;
      const size = wrap.offsetWidth;
      const x = Math.max(0, Math.min(window.innerWidth - size, start.left + dx));
      const y = Math.max(0, Math.min(window.innerHeight - size, start.top + dy));
      Object.assign(wrap.style, { left: `${x}px`, top: `${y}px`, right: "auto", bottom: "auto" });
      const vx = event.clientX - last.x, vy = event.clientY - last.y, speed = Math.hypot(vx, vy);
      if (speed > 1) Bubble.push(Math.atan2(-vy, -vx), Math.min(1.2, speed * 0.08));
      last = { x: event.clientX, y: event.clientY, t: performance.now() };
    };
    orb.onpointerup = orb.onpointercancel = (event) => {
      if (!start) return;
      orb.releasePointerCapture?.(event.pointerId);
      const wasDrag = moved;
      start = null;
      if (!wasDrag) { togglePause(); return; }
      const rect = wrap.getBoundingClientRect();
      try { localStorage.setItem("orbpos", JSON.stringify({ x: rect.left, y: rect.top })); } catch (_) {}
      Bubble.push(Math.random() * Math.PI * 2, 0.9);  // the landing wobble
    };
  }

  // Tap: pause everything and go red; tap again: back to listening.
  function togglePause() {
    paused = !paused;
    if (paused) {
      listenNext = false;
      Voice.interrupt();
      Voice.cancelListening();
      orb("paused", 0);
    } else {
      orb("idle", 0);
      Voice.listen();
    }
  }

  // Called by Voice: the orb mirrors what the audio is doing.
  function orb(stateName, level) {
    const el = $("orb");
    if (!el) return;
    if (paused && stateName !== "paused") stateName = "paused";
    if (stateName) {
      el.className = `orb ${stateName}`;
      el.title = stateName === "paused" ? "Tap to resume" : "Tap to pause";
      const label = $("orblabel");
      if (label) label.textContent = stateName === "paused" ? "Paused" : stateName === "error" ? "Error" : "";
    }
    if (level != null) el.style.setProperty("--level", Math.min(1, level).toFixed(2));
    Bubble.set(stateName || null, level);
  }
  // The transcript is the only text; the orb carries none.
  function caption() {}

  // The reply has been spoken (or there was nothing to speak): reopen the mic.
  function speechDone() {
    if (Voice.isListening() || Voice.isPending()) return;
    if (!listenNext || busy || paused || view !== "profile") { if (!busy) orb("idle", 0); return; }
    listenNext = false;
    Voice.listen({ quiet: true });
  }

  // Resolves once no turn is streaming. An interruption transcribed while
  // the reply is still arriving waits here rather than being dropped.
  function idle() {
    return new Promise((resolve) => {
      const tick = () => (busy ? setTimeout(tick, 100) : resolve());
      tick();
    });
  }

  function renderVoiceBar() {
    const bar = $("voicebar");
    if (!bar) return;
    if (!voice) { bar.innerHTML = `<span>Voice status unavailable.</span>`; return; }
    const stt = voice.stt.ready ? "ready" : Voice.browserSTT() ? "browser (speech model not set up)" : "unavailable";
    const tts = voice.tts.ready ? "ready" : "browser voice";
    let setup = "";
    if (voice.downloading) {
      setup = Object.entries(voice.progress).map(([name, p]) => p.state === "downloading" && p.total
        ? `<span>${escape(name)} <progress value="${p.done}" max="${p.total}"></progress></span>`
        : `<span>${escape(name)}: ${escape(p.state)}${p.error ? " — " + escape(p.error) : ""}</span>`).join("");
    } else if (voice.missing.length) {
      setup = `<button class="act" id="voiceSetup">Download the speech model (${voice.missing.length} file${voice.missing.length === 1 ? "" : "s"})</button>`;
    }
    const install = voice.stt.install ? `<span>Speech recognition not installed: <code>${escape(voice.stt.install)}</code></span>` : "";
    bar.innerHTML = `<span>Mic: ${stt}</span><span>Voice: ${tts}</span>${setup}${install}`;
    if ($("voiceSetup")) $("voiceSetup").onclick = async () => {
      voice = await api("/voice/setup", { method: "POST", body: "{}" });
      renderVoiceBar();
    };
  }

  function scrollChat() {
    const chat = $("chat");
    if (chat) chat.lastElementChild?.scrollIntoView({ block: "end" });
  }

  function bubble(cls, text) {
    const div = document.createElement("div");
    div.className = `msg ${cls}`;
    div.textContent = text;
    $("chat").appendChild(div);
    scrollChat();
    return div;
  }

  // One turn: post the message, render the SSE events as they come.
  async function send(text) {
    text = (text || "").trim();
    if (!text || busy || !$("chat")) return;
    busy = true;
    $("say").value = "";
    $("send").disabled = true;
    Voice.stopSpeaking();
    bubble("user", text);
    let live = bubble("bot live", "");
    orb("thinking", 0);
    caption(text);
    let captionText = "";
    const speaker = Voice.sentenceSpeaker(speak && !paused);  // paused is text only, both ways
    try {
      const res = await fetch("/profile/turn", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `HTTP ${res.status}`);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let index;
        while ((index = buffer.indexOf("\n\n")) >= 0) {
          const line = buffer.slice(0, index).trim();
          buffer = buffer.slice(index + 2);
          if (!line.startsWith("data: ")) continue;
          const event = JSON.parse(line.slice(6));
          if (event.type === "delta") { live.textContent += event.text; captionText += event.text; caption(captionText); speaker.feed(event.text, event.part, event.spoken); scrollChat(); }
          else if (event.type === "replace") { speaker.reset(); live.textContent = event.text; captionText = event.text; caption(captionText); speaker.feed(event.text, "ask", true); }
          else if (event.type === "break") { live.classList.remove("live"); speaker.flush(); live = bubble("bot live", ""); captionText = ""; }
          else if (event.type === "error") { live.classList.remove("live"); live.textContent = live.textContent || `Error: ${event.message}`; live.classList.add("stop"); orb("error", 0); caption(`Error: ${event.message}`); }
          else if (event.type === "experience" || event.type === "phase") { await refresh(); renderNav(); }
        }
      }
      speaker.flush();
    } catch (err) {
      live.textContent = `Error: ${err.message}`;
    } finally {
      live.classList.remove("live");
      if (!live.textContent) live.remove();
      busy = false;
      await refresh();
      // The heading follows the phase; the transcript on screen is already right.
      const heading = $("detail").querySelector(".head h2");
      const current = state.experiences.find((e) => e.slug === state.current);
      if (heading) heading.textContent = state.phase === "open" ? "All experiences covered — tell me anything new"
        : state.phase === "setup" ? "Before the stories"
        : state.phase === "facts" ? "About you"
        : current ? current.title : heading.textContent;
      const sub = $("detail").querySelector(".head .co");
      if (sub) sub.textContent = state.phase === "facts" ? `facts · ${state.facts?.asked || 0}/${state.facts?.total || 0}`
        : { setup: "checking the list", interviewing: "interviewing", open: "listening for updates" }[state.phase] || "";
      const skip = $("skipFacts");
      if (skip && state.phase !== "facts") skip.remove();
      renderNav();
      if ($("send")) $("send").disabled = false;
      if (!live.classList.contains("stop") && !paused) {
        // The mic reopens once the reply has been spoken.
        listenNext = true;
        if (!Voice.isSpeaking()) speechDone();
      } else if (!Voice.isSpeaking()) { Voice.stopWatching(); orb("idle", 0); }
    }
  }

  function say(text) { const s = Voice.sentenceSpeaker(true); s.feed(text); s.flush(); }

  async function openFacts() {
    leave();
    viewing = { slug: "_facts", name: "applicant.md" };
    renderNav();
    $("detail").innerHTML = `
      <div class="head"><h2>About you</h2><span class="co">facts the screen and the form fill use</span></div>
      <div class="actions">
        <button class="act" id="backToChat">← Back to the interview</button>
        ${state.phase === "new" ? "" : `<button class="act" id="redoFacts">${state.has_facts ? "Redo the facts" : "Answer the facts"}</button>`}
      </div>
      <div class="card doc" id="doc">${state.has_facts ? "loading…"
        : "Not written yet. The facts questions come first in the interview; answer them and this file appears."}</div>`;
    $("backToChat").onclick = () => { viewing = null; render(); };
    if ($("redoFacts")) $("redoFacts").onclick = () => redoFacts();
    if (state.has_facts) {
      const text = await fetch("/profile/facts").then((r) => r.text());
      if ($("doc") && viewing?.slug === "_facts") $("doc").innerHTML = docMarkdown(text);
    }
  }

  async function redoFacts() {
    try {
      const result = await api("/profile/facts/restart", { method: "POST", body: "{}" });
      state = result.status; viewing = null;
      render();
      listenNext = true;
      say(result.message);
    } catch (err) { alert(err.message); }
  }

  async function skipFacts() {
    try {
      const result = await api("/profile/facts/skip", { method: "POST", body: "{}" });
      state = result.status;
      render();
      listenNext = true;
      say(result.message);
    } catch (err) { alert(err.message); }
  }

  async function openDocument(slug, name) {
    leave();
    viewing = { slug, name };
    renderNav();
    renderDocument();
  }

  async function renderDocument() {
    const { slug, name } = viewing;
    const exp = state.experiences.find((e) => e.slug === slug) || { title: slug, documents: [] };
    const tabs = [["main.md", "In your words"], ["tailor.md", "For the tailor"], ["star.md", "Interview prep"]];
    $("detail").innerHTML = `
      <div class="head"><h2>${escape(exp.title)}</h2><span class="co">${escape(exp.kind || "")}</span></div>
      <div class="actions">
        <button class="act" id="backToChat">← Back to the interview</button>
        ${exp.closed ? `<button class="act" id="regen">Regenerate documents</button>` : ""}
        ${exp.children === "error" ? `<span class="hint">${escape(exp.children_error)}</span>` : ""}
      </div>
      <div class="doctabs">${tabs.map(([n, label]) =>
        `<button class="act" data-name="${n}" aria-current="${n === name}" ${exp.documents.includes(n) ? "" : "disabled"}>${label}</button>`).join("")}</div>
      <div class="card doc" id="doc">${exp.documents.includes(name) ? "loading…"
        : exp.closed ? "Not written yet. Documents follow the interview by a minute or two."
        : "Written when this experience's interview closes."}</div>`;
    $("backToChat").onclick = () => { viewing = null; render(); };
    if ($("regen")) $("regen").onclick = async () => {
      try { await api(`/profile/experiences/${slug}/regenerate`, { method: "POST", body: "{}" }); await refresh(); renderNav(); }
      catch (err) { alert(err.message); }
    };
    for (const button of $("detail").querySelectorAll(".doctabs button")) {
      button.onclick = () => openDocument(slug, button.dataset.name);
    }
    if (exp.documents.includes(name)) {
      const text = await fetch(`/profile/experiences/${slug}/${name}`).then((r) => r.text());
      if ($("doc") && viewing?.slug === slug && viewing?.name === name) $("doc").innerHTML = docMarkdown(text);
    }
  }

  function docMarkdown(text) {
    return escape(text)
      .replace(/^# (.+)$/gm, "<h1>$1</h1>")
      .replace(/^## (.+)$/gm, "<h2>$1</h2>")
      .replace(/^### (.+)$/gm, "<h2>$1</h2>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/^[-*]\s+(.+)$/gm, "<li>$1</li>")
      .replace(/(?:<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`)
      .replace(/```[a-z]*\n([\s\S]*?)```/g, "<pre>$1</pre>")
      .replace(/\n{2,}/g, "<p>");
  }

  return { open, leave, poll, send, orb, caption, speechDone, idle, docMarkdown, get voice() { return voice; },
           setViewing(v) { viewing = v; leave(); renderNav(); }, back() { viewing = null; refresh().then(render); },
           set form(f) { form = f; renderNav(); },
           get paused() { return paused; } };
})();

// ----------------------------------------------------------------- Bubble --
// The orb's shape, as physics rather than keyframes. The outline is a
// circle of radius R plus three standing-wave modes (two, three and four
// lobes), each a damped spring on its amplitude. A kick from the audio
// excites a mode at a random phase; the springs pull it back. Sums of low
// modes are smooth by construction (no spikes, zero mean), and the total
// amplitude is capped, so the ring reads as a firm circle that bounces
// rather than a shape that changes. The path is rebuilt each frame and
// drives the ring and its shadow. Thinking adds a bulge that follows the
// sweeping arc: it spans the arc, peaks at the head, fades to the tail,
// and blends into the circle at both ends.
const Bubble = (() => {
  const N = 48, R = 50, K = 0.06, DAMP = 0.9, MAX = 0.035;
  const modes = [2, 3, 4];
  const amp = new Float32Array(modes.length), vel = new Float32Array(modes.length), phase = new Float32Array(modes.length);
  // The thinking arc: length, radius, angular speed per frame, the bulge's
  // peak (fraction of R) and the blend at its ends (radians).
  const ARC = Math.PI * 0.55, ARC_R = 38, ARC_SPEED = 0.09, BULGE = 0.06, SOFT = 0.35;
  let el = null, state = "idle", level = 0, raf = 0, head = 0;
  const svg = () => `<svg viewBox="-70 -70 140 140" aria-hidden="true">
    <path class="shadow" id="orbshadow" d="" transform="translate(5,5)"/>
    <path class="ring" id="orbring" d=""/>
    <circle class="core" id="orbcore" r="8"/>
    <path class="arc" id="orbarc" d=""/>
  </svg>`;

  function attach(node) {
    el = node;
    if (!raf) raf = requestAnimationFrame(frame);
  }
  // A push from outside at `angle` (radians, screen axes): the two-lobe
  // mode lines up with it so the bubble squashes along the travel axis.
  function push(angle, amount) {
    phase[0] = -2 * angle;
    vel[0] += amount * 0.012;
    vel[2] += amount * 0.004;
  }
  // An internal kick: one random mode, random phase.
  function kick(amount) {
    const m = (Math.random() * modes.length) | 0;
    phase[m] = Math.random() * Math.PI * 2;
    vel[m] += amount * 0.012 * (Math.random() < 0.3 ? -1 : 1);
  }
  function set(name, lv) {
    if (name) state = name;
    if (lv != null) level = Math.min(1, lv);
  }

  const P = (x, y) => `${x.toFixed(2)},${y.toFixed(2)}`;
  const wrap = (x) => Math.atan2(Math.sin(x), Math.cos(x));
  // The bulge under the arc: u runs 0 at the tail to 1 at the head, the
  // profile is head-heavy, and SOFT radians past each end taper to zero.
  function bulge(a) {
    const d = wrap(a - head);
    if (d < -SOFT || d > ARC + SOFT) return 0;
    const shape = (u) => 1 - Math.pow(1 - u, 2.6);
    const u = d / ARC;
    if (u < 0) return BULGE * shape(0) * (1 + d / SOFT);
    if (u > 1) return BULGE * shape(1) * (1 - (d - ARC) / SOFT);
    return BULGE * shape(u);
  }

  function frame() {
    raf = 0;
    if (!el || !el.isConnected) { el = null; return; }
    const live = state === "listening" || state === "speaking", thinking = state === "thinking";
    // Kicks: the level excites a mode now and then; idle gets a whisper
    // so it never looks frozen; paused gets nothing.
    if (state !== "paused") {
      const amount = live ? 0.3 + level * 0.9 : 0.05;
      if (Math.random() < (live ? 0.06 + level * 0.14 : 0.02)) kick(amount * (0.5 + Math.random()));
    }
    let total = 0;
    for (let m = 0; m < modes.length; m++) {
      vel[m] = (vel[m] - K * amp[m]) * DAMP;
      amp[m] = (amp[m] + vel[m]) * (live ? 0.985 : 0.85);  // a slow leak; fast settle when not live
      if (!live) vel[m] *= 0.7;
      total += Math.abs(amp[m]);
    }
    if (total > MAX) for (let m = 0; m < modes.length; m++) amp[m] *= MAX / total;
    if (thinking) head += ARC_SPEED;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      let ripple = thinking ? bulge(a) : 0;
      for (let m = 0; m < modes.length; m++) ripple += amp[m] * Math.cos(modes[m] * a + phase[m]);
      const rad = R * (1 + ripple);
      pts.push([Math.cos(a) * rad, Math.sin(a) * rad]);
    }
    const d = smooth(pts);
    el.querySelector("#orbring")?.setAttribute("d", d);
    el.querySelector("#orbshadow")?.setAttribute("d", d);
    // The core: a dot at rest, grows with the level while live, gone while
    // the arc is doing the talking or the label is.
    const r = thinking || state === "paused" || state === "error" ? 0 : live ? 10 + 26 * level : 8;
    el.querySelector("#orbcore")?.setAttribute("r", r.toFixed(1));
    const arc = el.querySelector("#orbarc");
    if (arc) {
      if (thinking) {
        const a1 = head + ARC;
        arc.setAttribute("d", `M${P(Math.cos(head) * ARC_R, Math.sin(head) * ARC_R)}A${ARC_R},${ARC_R} 0 0 1 ${P(Math.cos(a1) * ARC_R, Math.sin(a1) * ARC_R)}`);
      } else arc.setAttribute("d", "");
    }
    raf = requestAnimationFrame(frame);
  }

  // Catmull-Rom through the points as cubic Beziers; closed by default.
  function smooth(pts, closed = true) {
    const n = pts.length;
    const at = (i) => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
    let d = `M${P(pts[0][0], pts[0][1])}`;
    const last = closed ? n : n - 1;
    for (let i = 0; i < last; i++) {
      const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
      d += `C${P(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6)} ${P(p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6)} ${P(p2[0], p2[1])}`;
    }
    return closed ? d + "Z" : d;
  }

  return { svg, attach, set, push, kick };
})();

// ------------------------------------------------------------------ Voice --
// Mic in, speech out. Local first (whisper.cpp / Piper on 8787), browser Web
// Speech API when a half is not set up. Recording is raw PCM encoded to a
// 16 kHz WAV here, so the server needs no ffmpeg.
const Voice = (() => {
  let recording = null;   // {ctx, source, processor, chunks, rate, stream}
  let recognition = null; // browser SpeechRecognition
  let playing = [];       // queue of Audio for local TTS
  let current = null;
  let handsFree = false;  // voice mode: stop on silence, reopen after replies
  let outCtx = null;      // AudioContext + analyser for the speaking level
  let analyser = null;
  let muted = false;      // interrupted: drop the rest of this reply's sentences
  let pending = false;    // an interruption is being transcribed and sent

  // Silence detection, hands-free only. RMS above SPEECH counts as talking;
  // SILENCE_MS of quiet after talking ends the turn. Before any talking the
  // mic stays open indefinitely, keeping only the last BARGE_KEEP_MS.
  const SPEECH = 0.015, SILENCE_MS = 1100;
  // Barge-in: while a reply plays the mic stays open in watch mode. A cough
  // or a keyboard is short and broadband, a fan is low; a voice is louder
  // than the speaker bleed (echo cancellation takes most of it), sits in
  // the 300-3400 Hz band and lasts. All three for BARGE_MS interrupt.
  // Off by default: the loudness-and-band gate cannot tell music from a
  // voice, and a song in the room flipped replies on and off. The tap
  // interrupts. A real voice detector (Silero VAD) is what turning this
  // back on needs.
  const BARGE_IN = false;
  const BARGE_RMS = 0.04, BARGE_BAND = [300, 3400], BARGE_SHARE = 0.55, BARGE_MS = 350, BARGE_KEEP_MS = 600;

  const browserSTT = () => !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const setHandsFree = (on) => { handsFree = !!on; };
  const isSpeaking = () => !!current || playing.length > 0 || (window.speechSynthesis?.speaking ?? false);
  const isListening = () => !!(recording && !recording.watch) || !!recognition;
  const isPending = () => pending;

  // Start listening; used by the greeting, the orb, and the hands-free loop.
  async function listen({ quiet = false } = {}) {
    if (recording?.watch) { engage(); return; }
    if (recording || recognition) return;
    stopSpeaking();
    const local = Profile.voice?.stt?.ready;
    try {
      if (local) await startLocal(); else if (browserSTT()) startBrowser();
      else if (quiet) return;
      else return alert("No speech input available: set up local voice, or use Chrome for browser speech.");
      $("mic")?.classList.add("on");
      Profile.orb("listening", 0);
    } catch (err) {
      // Auto-start with no gesture or no grant: stay idle, the tap asks again.
      if (quiet) { Profile.orb("idle", 0); return; }
      Profile.orb("error", 0); alert(`Microphone: ${err.message}`);
    }
  }

  // Stop the reply for good: nothing more of it is spoken.
  function interrupt() { muted = true; stopSpeaking(); }

  // A reply that will not be followed by a turn leaves no mic open.
  function stopWatching() { if (recording?.watch) cancelListening(); }

  // A watching mic becomes the live one: the turn starts here.
  function engage() {
    const rec = recording;
    if (!rec || !rec.watch) return;
    rec.watch = false;
    rec.started = performance.now();
    $("mic")?.classList.add("on");
    Profile.orb("listening", 0);
  }

  function cancelListening() {
    if (recognition) { recognition.onend = null; recognition.abort(); recognition = null; }
    if (recording) {
      const { ctx, source, processor, stream } = recording;
      recording = null;
      processor.disconnect(); source.disconnect();
      stream.getTracks().forEach((t) => t.stop());
      ctx.close();
    }
    $("mic")?.classList.remove("on");
  }

  async function startLocal(watch = false) {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    const ctx = new AudioContext();
    const source = ctx.createMediaStreamSource(stream);
    const processor = ctx.createScriptProcessor(4096, 1, 1);
    const spectrum = ctx.createAnalyser();
    spectrum.fftSize = 1024;
    const bins = new Uint8Array(spectrum.frequencyBinCount);
    const hz = ctx.sampleRate / spectrum.fftSize;
    const lo = Math.floor(BARGE_BAND[0] / hz), hi = Math.ceil(BARGE_BAND[1] / hz);
    const chunks = [];
    const rec = { ctx, source, processor, chunks, rate: ctx.sampleRate, stream, watch, started: performance.now() };
    let spokeAt = 0, voicedSince = 0;
    processor.onaudioprocess = (event) => {
      const data = new Float32Array(event.inputBuffer.getChannelData(0));
      chunks.push(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
      const rms = Math.sqrt(sum / data.length);
      const now = performance.now();
      if (rec.watch || !spokeAt) {
        // Nothing said yet: keep only the last BARGE_KEEP_MS so the first
        // word survives the trigger and an open mic does not fill memory.
        const keep = Math.ceil((BARGE_KEEP_MS / 1000) * rec.rate / data.length);
        if (chunks.length > keep) chunks.splice(0, chunks.length - keep);
      }
      if (rec.watch) {
        spectrum.getByteFrequencyData(bins);
        let band = 0, total = 0;
        for (let i = 1; i < bins.length; i++) { total += bins[i]; if (i >= lo && i <= hi) band += bins[i]; }
        const voiced = rms > BARGE_RMS && total > 0 && band / total > BARGE_SHARE;
        if (!voiced) { voicedSince = 0; return; }
        if (!voicedSince) { voicedSince = now; return; }
        if (now - voicedSince < BARGE_MS) return;
        interrupt();
        engage();
        spokeAt = now;
        return;
      }
      Profile.orb(null, rms * 8);
      if (!handsFree) return;
      if (rms > SPEECH) spokeAt = now;
      else if (spokeAt && now - spokeAt > SILENCE_MS) stop();
    };
    source.connect(spectrum);
    source.connect(processor);
    processor.connect(ctx.destination);
    recording = rec;
  }

  // Open the mic in watch mode while a reply plays, hands-free and local only.
  async function watchForBargeIn() {
    if (!BARGE_IN || !handsFree || Profile.paused || recording || recognition || !Profile.voice?.stt?.ready) return;
    try { await startLocal(true); } catch (_) { /* no mic: the tap still interrupts */ }
  }

  function startBrowser() {
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new Rec();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";
    let finalText = "";
    recognition.onresult = (event) => {
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const r = event.results[i];
        if (r.isFinal) finalText += r[0].transcript + " "; else interim += r[0].transcript;
      }
      if ($("say")) $("say").value = (finalText + interim).trim();
    };
    recognition.onerror = (event) => { if (event.error !== "no-speech") alert(`Speech: ${event.error}`); };
    recognition.onend = () => { recognition = null; $("mic")?.classList.remove("on"); const t = $("say")?.value; if (t) Profile.send(t); else Profile.orb("idle", 0); };
    recognition.start();
  }

  async function stop() {
    const button = $("mic");
    if (recognition) { recognition.stop(); return; }
    if (!recording || recording.watch) return;
    const { ctx, source, processor, chunks, rate, stream } = recording;
    recording = null;
    pending = true;
    processor.disconnect(); source.disconnect();
    stream.getTracks().forEach((t) => t.stop());
    await ctx.close();
    button?.classList.remove("on");
    button?.classList.add("busy");
    if ($("say")) $("say").placeholder = "Transcribing…";
    Profile.orb("thinking", 0);
    Profile.caption("…");
    try {
      const wav = encodeWav(downsample(concat(chunks), rate, 16000), 16000);
      const res = await fetch("/voice/transcribe", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `HTTP ${res.status}`);
      const { text } = await res.json();
      if (text) { await Profile.idle(); Profile.send(text); }
      else { Profile.caption("Heard nothing"); if (!Profile.paused) listen({ quiet: true }); else Profile.orb("idle", 0); }
    } catch (err) { Profile.orb("error", 0); alert(`Transcription: ${err.message}`); }
    finally { pending = false; button?.classList.remove("busy"); }
  }

  function concat(chunks) {
    const out = new Float32Array(chunks.reduce((n, c) => n + c.length, 0));
    let offset = 0;
    for (const c of chunks) { out.set(c, offset); offset += c.length; }
    return out;
  }
  function downsample(samples, from, to) {
    if (from === to) return samples;
    const ratio = from / to;
    const out = new Float32Array(Math.floor(samples.length / ratio));
    for (let i = 0; i < out.length; i++) {
      const start = Math.floor(i * ratio), end = Math.floor((i + 1) * ratio);
      let sum = 0;
      for (let j = start; j < end; j++) sum += samples[j];
      out[i] = sum / (end - start || 1);
    }
    return out;
  }
  function encodeWav(samples, rate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buffer);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return buffer;
  }

  // Speaks a streamed reply sentence by sentence, starting on the first one.
  // Only the spoken parts are voiced: the server labels `ack` and `ask`
  // (spoken) and `note` (text only). Unlabelled text, from a model that
  // ignored the format or from an old transcript, gets the fallback rule:
  // the first sentence and every question. A short pause follows the ack.
  const ACK_PAUSE_MS = 450;
  function sentenceSpeaker(enabled) {
    let buffer = "", part = null, spoken = null, count = 0;
    muted = false;
    const wanted = (sentence) => spoken != null ? spoken : (count === 0 || sentence.endsWith("?"));
    const drain = (all) => {
      let match;
      while ((match = /^([\s\S]*?[.!?])(\s+)/.exec(buffer))) {
        const sentence = match[1].trim();
        if (sentence && wanted(sentence)) enqueue(sentence);
        if (sentence) count++;
        buffer = buffer.slice(match[0].length);
      }
      if (all && buffer.trim()) { if (wanted(buffer.trim())) enqueue(buffer.trim()); count++; buffer = ""; }
    };
    const feed = (text, nextPart, nextSpoken) => {
      if (!enabled) return;
      const p = nextPart || null;
      if (p !== part) {
        // A part boundary is a sentence boundary; leaving the ack adds the pause.
        drain(true);
        if (part === "ack" && p) pause(ACK_PAUSE_MS);
        part = p;
        spoken = nextSpoken == null ? null : !!nextSpoken;
      }
      buffer += text;
      drain(false);
    };
    const flush = () => { if (enabled) drain(true); buffer = ""; };
    const reset = () => { buffer = ""; part = null; spoken = null; count = 0; stopSpeaking(); };
    return { feed, flush, reset };
  }

  function pause(ms) {
    if (muted) return;
    playing.push({ pause: ms, ready: Promise.resolve() });
    playNext();
  }

  function enqueue(sentence) {
    if (!sentence || muted) return;
    if (Profile.voice?.tts?.ready) {
      const item = { sentence, audio: null, ready: fetch("/voice/speak", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: sentence }) })
        .then((r) => r.ok ? r.blob() : null).then((blob) => { if (blob) item.audio = new Audio(URL.createObjectURL(blob)); }) };
      playing.push(item);
      playNext();
    } else if (window.speechSynthesis) {
      const utterance = new SpeechSynthesisUtterance(sentence);
      utterance.lang = "en-US";
      utterance.onstart = () => Profile.orb("speaking", 0.5);
      utterance.onend = () => { if (!speechSynthesis.pending) Profile.speechDone(); };
      speechSynthesis.speak(utterance);
    }
  }
  async function playNext() {
    if (current) return;
    if (!playing.length) { Profile.speechDone(); return; }
    current = playing.shift();
    await current.ready;
    if (current?.pause) { const item = current; setTimeout(() => { if (current === item) { current = null; playNext(); } }, item.pause); return; }
    if (!current || !current.audio) { current = null; return playNext(); }
    current.audio.onended = () => { current = null; playNext(); };
    current.audio.onerror = () => { current = null; playNext(); };
    meter(current.audio);
    Profile.orb("speaking", 0);
    try { await current.audio.play(); } catch (_) { current = null; playNext(); }
    watchForBargeIn();
  }
  // The speaking level for the orb, read off the element through an analyser.
  function meter(audio) {
    try {
      if (!outCtx) { outCtx = new AudioContext(); analyser = outCtx.createAnalyser(); analyser.fftSize = 512; analyser.connect(outCtx.destination); }
      if (outCtx.state === "suspended") outCtx.resume();
      outCtx.createMediaElementSource(audio).connect(analyser);
    } catch (_) { return; }
    const data = new Uint8Array(analyser.fftSize);
    const tick = () => {
      if (current?.audio !== audio) return;
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
      Profile.orb(null, Math.sqrt(sum / data.length) * 4);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  function stopSpeaking() {
    playing = [];
    if (current?.audio) current.audio.pause();
    current = null;
    if (window.speechSynthesis) speechSynthesis.cancel();
  }

  return { listen, cancelListening, browserSTT, sentenceSpeaker, stopSpeaking, interrupt, stopWatching,
           setHandsFree, isSpeaking, isListening, isPending };
})();
</script>
