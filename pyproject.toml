[project]
name = "job-autopilot"
version = "0.1.0"
description = "Semi-autonomous job application pipeline with mandatory human checkpoints"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
browser = ["browser-use>=0.1.40"]
# Speech out through Kokoro (ONNX Runtime, no torch). Needs a working
# espeak-ng: `brew install espeak-ng` on Apple Silicon, see voice/kokoro.py.
voice = ["kokoro-onnx>=0.6"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "tailor", "tex", "browser", "archive", "voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The app runs from this folder; uv installs its dependencies, not the app.
package = false
# Apple Silicon Macs only; the lock need not solve for anything else.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
