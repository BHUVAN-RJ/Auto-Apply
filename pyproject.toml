[project]
name = "job-autopilot"
version = "0.1.0"
description = "Semi-autonomous job application pipeline with mandatory human checkpoints"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
browser = ["browser-use>=0.1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "tailor", "tex", "browser", "archive"]
